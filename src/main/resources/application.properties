spring.application.name=lru-page-simulator
server.port=${PORT:8080}

# Points to the existing database. No database or table creation is requested here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lrudb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:ayush}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The app works with the existing simulation_runs table and never runs schema initialization.
spring.sql.init.mode=never
